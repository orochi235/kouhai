name: site

on:
  push:
    branches: [main]
    paths:
      [
        site/**,
        outlets/web/**,
        src/engine/**,
        scripts/site.ts,
        package-lock.json,
        .github/workflows/site.yml,
      ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: kouhai
      # The page builds against weasel's source until a weasel release carries what it uses.
      - uses: actions/checkout@v7
        with:
          repository: orochi235/weasel
          ref: 9c6ce8a015943176d6269305e5853dec2abf14ff
          path: weasel
      - uses: actions/setup-node@v7
        with:
          node-version-file: kouhai/.nvmrc
      - run: npm ci && npm run build
        working-directory: weasel
      - run: npm ci && npm run site
        working-directory: kouhai
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: kouhai/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
